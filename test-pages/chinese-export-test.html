<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>TableFlow Chinese Export Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 32px;
    }

    table {
      border-collapse: collapse;
      min-width: 680px;
    }

    th,
    td {
      border: 1px solid #cfd6e4;
      padding: 10px 12px;
      text-align: left;
    }

    th {
      background: #eef2ff;
    }
  </style>
</head>
<body>
  <h1>TableFlow Chinese Export Test</h1>
  <table>
    <thead>
      <tr>
        <th>产品名称</th>
        <th>价格</th>
        <th>供应商</th>
        <th>备注</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>蓝牙耳机</td>
        <td>19.90</td>
        <td>深圳供应商</td>
        <td>支持中文导出</td>
      </tr>
      <tr>
        <td>榴莲鲜果</td>
        <td>88.00</td>
        <td>马来西亚供应商</td>
        <td>冷冻果肉</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
