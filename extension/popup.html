<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TableFlow</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <header>
      <div>
        <h1>TableFlow</h1>
        <p>Export visible web tables locally.</p>
      </div>
      <span class="badge">Private</span>
    </header>

    <button id="scan" class="primary">Scan this page</button>
    <p id="status" class="status">No page scanned yet.</p>

    <section id="results" hidden>
      <label for="tableSelect">Detected data</label>
      <select id="tableSelect"></select>
      <div id="preview"></div>

      <label for="format">Export format</label>
      <select id="format">
        <option value="csv">CSV</option>
        <option value="json">JSON</option>
        <option value="markdown">Markdown</option>
      </select>

      <div class="actions">
        <button id="copy">Copy</button>
        <button id="download" class="primary">Download</button>
      </div>
    </section>

    <footer>Data never leaves your browser.</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
