<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TableFlow Pro Activated</title>
  <style>
    :root {
      color: #172033;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: #f6f8fb;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(560px, calc(100% - 32px));
      background: #fff;
      border: 1px solid #dfe4ec;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(23, 32, 51, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      line-height: 1.1;
    }

    p {
      color: #687386;
      line-height: 1.6;
    }

    .status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      background: #eef2ff;
      color: #243b7a;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Activating TableFlow Pro</h1>
    <p>Payment was received by Stripe. This page is unlocking unlimited exports in your TableFlow extension.</p>
    <div id="status" class="status">Checking payment...</div>
  </main>

  <script src="success.js"></script>
</body>
</html>
