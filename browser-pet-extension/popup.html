<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Browser Pet</title>
  <style>
    body{font-family:system-ui,sans-serif;width:280px;margin:0;padding:16px;color:#172033;background:#f7f8fb}h1{font-size:18px;margin:0 0 6px}p{font-size:12px;color:#667085}label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}input,button{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cfd5df;border-radius:9px;font:inherit;background:white}button{margin-top:10px;background:#172033;color:#fff;font-weight:800;cursor:pointer}.row{display:flex;align-items:center;gap:8px;margin-top:12px}.row input{width:auto}.note{font-size:11px;margin-top:10px}
  </style>
</head>
<body>
  <h1>My Browser Pet</h1>
  <p>A tiny companion for the webpages you visit.</p>
  <label for="petName">Pet name</label>
  <input id="petName" maxlength="24" placeholder="Mochi" />
  <label class="row"><input id="petEnabled" type="checkbox" /> Show pet on webpages</label>
  <button id="save" type="button">Save</button>
  <p id="status" class="note"></p>
  <script src="popup.js"></script>
</body>
</html>
